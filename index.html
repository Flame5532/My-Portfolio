<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nesiab — Web Designer</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1B2430;
    --paper: #F1EEE7;
    --teal: #2E6E62;
    --sand: #E8B76B;
  }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }
  .display-font { font-family: 'Space Grotesk', sans-serif; }
  .mono-font { font-family: 'JetBrains Mono', monospace; }

  .card-profile {
    max-width: 420px;
    border-radius: 28px;
    border: 1px solid rgba(27,36,48,0.12);
    box-shadow: 0 30px 60px -30px rgba(27,36,48,0.25);
  }

  .avatar {
    width: 108px;
    height: 108px;
    border-radius: 50%;
    background: linear-gradient(150deg, var(--teal), #1d4b43);
    color: var(--paper);
    font-weight: 700;
    font-size: 2.2rem;
    border: 4px solid #fff;
    box-shadow: 0 0 0 1px rgba(27,36,48,0.12);
    /* To use a real photo instead of initials, replace the letters below with:
       <img src="your-photo.jpg" class="w-100 h-100" style="object-fit:cover; border-radius:50%;"> */
  }

  .status-dot {
    width: 18px;
    height: 18px;
    bottom: 4px;
    right: 4px;
    background: #3FAE7A;
    border: 3px solid #fff;
  }

  .status-dot::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: #3FAE7A;
    animation: pulse 2s ease-out infinite;
  }

  @keyframes pulse {
    0% { opacity: 0.7; transform: scale(1); }
    100% { opacity: 0; transform: scale(2.2); }
  }

  .badge-available {
    background: rgba(63,174,122,0.12);
    color: #2C7A54;
    font-size: 0.72rem;
    letter-spacing: 0.05em;
    padding: 7px 14px;
  }

  .skill-chip {
    font-size: 0.72rem;
    border: 1px solid rgba(27,36,48,0.12);
    color: rgba(27,36,48,0.75);
    padding: 7px 12px;
  }

  .link-btn {
    text-decoration: none;
    color: var(--ink);
    border: 1px solid rgba(27,36,48,0.12);
    border-radius: 14px;
    font-weight: 500;
    font-size: 0.95rem;
    padding: 15px 18px;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }

  .link-btn:hover {
    transform: translateY(-2px);
    border-color: var(--teal);
    color: var(--ink);
  }

  .link-btn.primary {
    background: var(--teal);
    color: var(--paper);
    border-color: var(--teal);
  }

  .link-btn.primary:hover { color: var(--paper); }

  .link-btn .arrow { color: rgba(27,36,48,0.4); }
  .link-btn.primary .arrow { color: var(--sand); }

  @media (prefers-reduced-motion: reduce) {
    .status-dot::after { animation: none; }
  }
</style>
</head>
<body class="d-flex justify-content-center align-items-start py-5 px-3">

  <div class="card card-profile bg-white p-4 pt-4">

    <div class="d-flex justify-content-center mb-3">
      <div class="avatar rounded-circle d-flex align-items-center justify-content-center position-relative display-font">
        <img src="nt.jpeg" alt="Ismail Abbas" class="w-100 h-100" style="object-fit:cover; border-radius:50%;">
        <span class="status-dot rounded-circle position-absolute"></span>
      </div>
    </div>

    <h1 class="display-font fw-bold text-center fs-4 mb-1">Nesiab Tech</h1>
    <p class="text-center mb-3" style="color: rgba(27,36,48,0.62); font-size: 0.95rem;">
      Web designer · I build clean sites for small businesses &amp; creators
    </p>

    <div class="d-flex justify-content-center mb-4">
      <span class="badge rounded-pill badge-available mono-font text-uppercase">● Available for freelance work</span>
    </div>

    <div class="d-flex flex-wrap justify-content-center gap-2 mb-4">
      <span class="badge rounded-pill bg-white skill-chip mono-font">Landing Pages</span>
      <span class="badge rounded-pill bg-white skill-chip mono-font">HTML/CSS</span>
      <span class="badge rounded-pill bg-white skill-chip mono-font">Responsive Design</span>
      <span class="badge rounded-pill bg-white skill-chip mono-font">Portfolio Sites</span>
    </div>

    <div class="d-flex flex-column gap-2 mb-4">
      <a class="link-btn primary d-flex justify-content-between align-items-center" href="https://wa.me/2348123317162">
        <span>Message me on WhatsApp</span>
        <span class="arrow mono-font">→</span>
      </a>
      <a class="link-btn d-flex justify-content-between align-items-center" href="portfolio.html">
        <span>See my portfolio</span>
        <span class="arrow mono-font">→</span>
      </a>
    </div>

    <p class="text-center mono-font mb-0" style="font-size: 0.72rem; color: rgba(27,36,48,0.4);">
      Open to remote work · Anywhere
    </p>

  </div>

</body>
</html>
